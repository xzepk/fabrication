[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cladding-delivery"
version = "3.1.0"
description = "Traceable Windows/Linux cladding and curtain-wall engineering workflow with OCCT/CadQuery geometry backend."
requires-python = ">=3.11,<3.15"
dependencies = [
  "cadquery>=2.6,<3",
  "ezdxf>=1.3,<2",
  "PyYAML>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build123d = ["build123d>=0.10,<0.11"]

[project.scripts]
cladding-delivery = "cladding_delivery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cladding-delivery/config" = ["config/*.yaml"]
"share/cladding-delivery/schemas" = ["schemas/*.json"]
